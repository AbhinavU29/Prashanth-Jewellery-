name: Update Kerala rates
on:
  schedule:
    - cron: "30-55/5 3 * * *"   # 9:00-9:25 AM IST, every 5 min
    - cron: "*/5 4 * * *"       # 9:30-10:25 AM IST, every 5 min
    - cron: "0-30/5 5 * * *"    # 10:30-11:00 AM IST, every 5 min
    - cron: "0,30 0-2 * * *"    # 5:30-8:30 AM IST, every 30 min
    - cron: "0 3 * * *"         # 8:30 AM IST
    - cron: "0,30 6-23 * * *"   # 11:30 AM-5:00 AM IST, every 30 min
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-rates
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/update_rates.py
      - name: Commit changes
        run: |
          git config user.name "pj-rates-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/rates.json
          git diff --staged --quiet || (git pull --rebase -q; git commit -m "Update rates $(date -u +%FT%H:%MZ)" && git push)
