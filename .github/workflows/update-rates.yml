name: Update Kerala rates
on:
  schedule:
    # 09:00 - 11:30 AM IST = 03:30 - 06:00 UTC (morning release, every 15 min)
    - cron: "*/15 3-5 * * *"
    # 01:30 - 03:15 PM IST = 08:00 - 09:45 UTC (afternoon revisions window: 1:30 PM to 3:00 PM IST, every 10 min)
    - cron: "*/10 8-9 * * *"
    # Rest of active market hours (11:30 AM - 01:30 PM & 03:15 PM - 06:30 PM IST)
    - cron: "10,35 6,7,10,11,12 * * *"
    # Off-market hours (every 2-3 hours)
    - cron: "0 0,2,14,16,18,21 * * *"
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-rates
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/run_cycle.py
