name: Update Kerala rates
on:
  schedule:
    # 03:30 - 06:30 UTC = 09:00 - 12:00 PM IST (morning release, every 15 min)
    - cron: "*/15 3-6 * * *"
    # 06:30 - 13:00 UTC = 12:00 - 06:30 PM IST (afternoon revisions, every 20 min)
    - cron: "*/20 7-13 * * *"
    # Off-market hours (every 2 hours)
    - cron: "0 0,2,14,16,18,20,22 * * *"
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-rates
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/run_cycle.py
