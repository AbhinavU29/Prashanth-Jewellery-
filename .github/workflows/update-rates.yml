name: Update Kerala rates
on:
  schedule:
    - cron: "20 3 * * *"     # 8:50 AM IST: starts the 9-11 AM run that polls every 5 minutes
    - cron: "7,37 * * * *"   # every 30 minutes, all day (off the busy :00/:30 marks)
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/**"]   # uploading new scripts runs an update immediately
  workflow_dispatch:
permissions:
  contents: write            # only to commit data/*.json
concurrency:
  group: update-rates
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/run_cycle.py
