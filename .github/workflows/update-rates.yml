name: Update Kerala rates
on:
  schedule:
    - cron: "15,45 3-9 * * *"   # every 30 min, about 8:45 AM to 3:15 PM IST
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/update_rates.py
      - name: Commit changes
        run: |
          git config user.name "pj-rates-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase -q || true
          git add data/rates.json
          git diff --staged --quiet || (git commit -m "Update rates $(date -u +%F)" && git push)
